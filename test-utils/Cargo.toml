[package]
name = "test-utilities"
version = "0.1.0"
publish = false
edition = "2021"

[features]
default = []
transfer-hook = ["transfer_hook"]

[dependencies]
solana-account-v3 = { package = "solana-account", version = "3.4.0" }
marginfi-type-crate = { workspace = true, features = ["anchor"] }
kamino-mocks = { path = "../programs/kamino-mocks" , features = ["no-entrypoint", "agave-v4-test"]}
drift-mocks = { path = "../programs/drift-mocks" , features = ["no-entrypoint"]}
juplend-mocks = { path = "../programs/juplend-mocks" , features = ["no-entrypoint"]}

solana-cli-output = { workspace = true }
solana-commitment-config = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-logger = { workspace = true }
solana-program-pack = { workspace = true }
solana-sha256-hasher = { workspace = true }
solana-program-test = { workspace = true }
solana-sdk = "4.0.1"
solana-instructions-sysvar = { workspace = true }
solana-system-interface = { workspace = true }
solana-system-transaction = "4.0.0"
spl-transfer-hook-interface = { workspace = true }
spl-pod = { workspace = true }

anchor-lang = { workspace = true }
anchor-spl = { workspace = true }

pyth-solana-receiver-sdk = { workspace = true }

bytemuck = { workspace = true }
fixed = { workspace = true }
fixed-macro = { workspace = true }
lazy_static = { workspace = true }
static_assertions = { workspace = true }
anyhow = "1.0.66"
assert_matches = "1.5.0"
bincode = "1.3.3"
futures = "0.3.25"
pretty_assertions = "1.2.1"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"

marginfi = { workspace = true, features = ["test-bpf"] }
transfer_hook = { workspace = true, features = [
    "no-entrypoint",
], optional = true }
mocks = { workspace = true, features = ["no-entrypoint"] }
