[package]
name = "scope-mocks"
version = "0.1.0"
description = "Mirrored Scope (Kamino oracle aggregator) account layouts, shared with the marginfi program and TS tests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "scope_mocks"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]

[dependencies]
anchor-lang = { workspace = true }
bytemuck = { workspace = true }
static_assertions = { workspace = true }
marginfi-type-crate = { workspace = true, features = ["anchor"] }
