[package]
name = "marginfi-type-crate"
version = "0.2.0"
edition = "2021"
publish = true
description = "Anchor-optional marginfi account types and instruction builders"
license = "Apache-2.0"
repository = "https://github.com/0dotxyz/marginfi-v2"
readme = "README.md"

[lib]
crate-type = ["cdylib", "lib"]
name = "marginfi_type_crate"

[features]
default = ["client", "anchor"]
client = []
anchor = ["dep:anchor-lang", "pdas"]
ix_builders = ["dep:borsh", "dep:solana-instruction", "dep:solana-pubkey", "solana-pubkey/borsh"]
pdas = ["dep:solana-instruction", "dep:solana-pubkey", "solana-pubkey/curve25519", "solana-pubkey/sha2"]
localnet = []
mainnet-beta = []
staging = []
stagingalt = []
devnet = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
fixed = { workspace = true }
fixed-macro = { workspace = true }
bs58 = { workspace = true }
static_assertions = { workspace = true }
solana-pubkey = { workspace = true, features = ["bytemuck"], optional = true }

anchor-lang = { workspace = true, optional = true }
solana-instruction = { workspace = true, optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
# Pins `pdas::get_associated_token_address_with_program_id` against the canonical
# implementation without making SPL a dependency of the crate itself.
spl-associated-token-account = { workspace = true }
solana-account-info = "3.1.1"
solana-cpi = "3.1.0"
solana-program-error = "3.0.1"

[[test]]
name = "borsh_arg_encoding"
required-features = ["ix_builders"]

[[example]]
name = "native_cpi"
required-features = ["ix_builders"]
