[package]
name = "marginfi-type-crate"
version = "0.2.0"
edition = "2021"
publish = true
description = "Anchor-optional marginfi account types, instruction builders, and PDA derivations"
license = "Apache-2.0"
repository = "https://github.com/0dotxyz/marginfi-v2"
documentation = "https://docs.rs/marginfi-type-crate"
readme = "README.md"
keywords = ["solana", "marginfi", "defi", "cpi"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[lib]
crate-type = ["cdylib", "lib"]
name = "marginfi_type_crate"

[[example]]
name = "native_cpi"
required-features = ["ix_builders"]

[features]
default = []
anchor = ["dep:anchor-lang", "pdas"]
# Instruction builders. Depends on solana crates only, never on anchor.
ix_builders = ["dep:borsh", "dep:solana-instruction", "solana-pubkey/borsh"]
# PDA derivations. Off-chain these need the curve/hash impls; on-chain they are syscalls.
pdas = ["dep:solana-instruction", "solana-pubkey/curve25519", "solana-pubkey/sha2"]
mainnet-beta = ["id-crate/mainnet-beta"]
staging = ["id-crate/staging"]
stagingalt = ["id-crate/stagingalt"]
devnet = ["id-crate/devnet"]
# Selects the localnet program ID, which is also what id-crate falls back to when no network
# feature is set. Exists so `ix_builders` consumers must name a cluster instead of defaulting to one.
localnet = ["id-crate/localnet"]

[dependencies]
id-crate = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
fixed = { workspace = true }
fixed-macro = { workspace = true }
bs58 = { workspace = true }
static_assertions = { workspace = true }
solana-pubkey = { workspace = true, features = ["bytemuck"] }

anchor-lang = { workspace = true, optional = true }
solana-instruction = { workspace = true, optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
# Pins `pdas::get_associated_token_address_with_program_id` against the canonical
# implementation without making SPL a dependency of the crate itself.
spl-associated-token-account = { workspace = true }
solana-account-info = "3.1.1"
solana-cpi = "3.1.0"
solana-program-error = "3.0.1"
